name: hindustan_traders
description: A real production-ready wholesale grocery ordering app for OdiaTraders.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  supabase_flutter: ^2.10.3
  provider: ^6.0.6
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.2.0
  json_annotation: ^4.9.0
  http: ^1.6.0
  permission_handler: ^11.0.0
  speech_to_text: ^7.0.0
  share_plus: ^13.3.0
  pdf: ^3.11.1
  printing: ^5.13.4
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/translations/
    - assets/images/branding/
    - assets/images/illustrations/
    - assets/images/products/
    - assets/images/products/beverages/
    - assets/images/products/cooking_oils/
    - assets/images/products/dairy_bakery/
    - assets/images/products/dry_fruits_nuts/
    - assets/images/products/flours_atta/
    - assets/images/products/fruits/
    - assets/images/products/miscellaneous/
    - assets/images/products/packaged_foods/
    - assets/images/products/pulses_lentils/
    - assets/images/products/rice_grains/
    - assets/images/products/snacks_namkeen/
    - assets/images/products/spices/
    - assets/images/products/sugar_salt/
    - assets/images/products/vegetables/