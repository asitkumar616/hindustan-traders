name: hindustan_traders
description: A real production-ready wholesale grocery ordering app for Hindustan Traders.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  supabase_flutter: ^2.10.3
  provider: ^6.0.6
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.2.0
  json_annotation: ^4.9.0
  http: ^1.6.0
  permission_handler: ^11.0.0
  speech_to_text: ^7.0.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/translations/